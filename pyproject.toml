[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sceneharbor"
version = "1.0.0"
description = "Scene-by-scene local AI video restoration with visual review and resumable exports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pillow>=11.3,<13",
  "python-multipart>=0.0.22,<1",
  "uvicorn>=0.34,<1",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/iyuzhang/sceneharbor"
Issues = "https://github.com/iyuzhang/sceneharbor/issues"

[project.scripts]
sceneharbor = "sceneharbor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sceneharbor"]
