name: Package smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Verify entry point and packaged assets
        run: |
          sceneharbor --version
          python -c 'from importlib.resources import files; assert files("sceneharbor").joinpath("static", "index.html").is_file()'
          node --check src/sceneharbor/static/app.js
